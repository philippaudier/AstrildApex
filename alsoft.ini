# OpenAL Soft Configuration
# This file configures OpenAL Soft to reduce warnings and optimize audio playback

[general]
# Reduce console output for cleaner logs
loglevel = 1

# Audio output driver (try wasapi, directsound, or winmm if one doesn't work)
drivers = wasapi,directsound,winmm

[wasapi]
# Disable padding warnings (the error you're seeing)
allow-resampler = true
